# Configuration of create-bodymap.py.

# Parts of file names that can be used in any path template below, in
# addition to {sub} and {ses}.
variables:
  task: "{sub}_{ses}_task-bodyloc_run-1_space-MNI152NLin2009cAsym"
  anat: "fmriprep/output/{sub}/{ses}/anat/{sub}_{ses}"

# Paths relative to --base-dir (the derivatives folder). Surface paths
# also use {hemi} (L or R) and native/MNI surfaces use {surf}
# (e.g. pial, white).
paths:
  # Inputs.
  z_score: "nilearn/output/{sub}/{ses}/func/{task}_desc-z_score-unmasked_stats.nii.gz"
  p_value: "nilearn/output/{sub}/{ses}/func/{task}_desc-p_value-unmasked_stats.nii.gz"
  brain_mask: "fmriprep/output/{sub}/{ses}/func/{task}_desc-brain_mask.nii.gz"
  atlas: "atlases_mni/output/{sub}/{ses}/{sub}_{ses}_space-MNI152NLin2009cAsym_desc-aparcDKTaseg_dseg.nii.gz"
  t1: "{anat}_space-MNI152NLin2009cAsym_desc-preproc_T1w.nii.gz"
  xfm_mni_to_t1w: "{anat}_from-MNI152NLin2009cAsym_to-T1w_mode-image_xfm.h5"
  native_surface: "{anat}_hemi-{hemi}_{surf}.surf.gii"
  sphere_reg: "{anat}_hemi-{hemi}_space-fsaverage_desc-reg_sphere.surf.gii"
  midthickness: "{anat}_hemi-{hemi}_midthickness.surf.gii"

  # Outputs, in the order the steps create them.
  p_value_corrected: "nilearn/output/{sub}/{ses}/func/{task}_desc-p_value_corrected-unmasked_stats.nii.gz"
  thresholded: "wta/output/{sub}/{ses}/{task}_desc-thresholded_stats.nii.gz"
  rois: "wta/output/{sub}/{ses}/{task}_desc-hemi_specific_rois.nii.gz"
  wta: "wta/output/{sub}/{ses}/{task}_desc-wta.nii.gz"
  segmentation: "wta/output/{sub}/{ses}/{task}_desc-wta_segmentation.nii.gz"
  # Saved as <name>_hemi-L.gii and <name>_hemi-R.gii plus a sidecar.
  mni_surface: "{anat}_space-MNI152NLin2009cAsym_desc-polymesh_{surf}.gii"
  projected: "wta/output/{sub}/{ses}/{task}_desc-surf_wta.gii"
  # Saved by io_utils.save_surface as <name>_{mesh,data}_hemi-{L,R}.gii
  # plus a sidecar.
  fsaverage_labels: "wta/output/{sub}/{ses}/{sub}_{ses}_task-bodyloc_run-1_space-fsaverage_desc-surf_wta.gii"
  plot_mni: "wta/output/{sub}/{ses}/{task}_desc-projected_plot.png"
  plot_fsaverage: "wta/output/{sub}/{ses}/{sub}_{ses}_task-bodyloc_run-1_space-fsaverage_desc-projected_plot.png"
  views_mni: "wta/output/{sub}/{ses}/{task}_desc-projected_views_plot.png"
  views_fsaverage: "wta/output/{sub}/{ses}/{sub}_{ses}_task-bodyloc_run-1_space-fsaverage_desc-projected_views_plot.png"
  html: "wta/output/{sub}/{ses}/{sub}_{ses}_task-bodyloc_run-1_space-fsaverage_desc-projected_interactive.html"
  resampled_t1: "wta/output/{sub}/{ses}/{sub}_{ses}_space-MNI152NLin2009cAsym_desc-preproc_resampled_T1w.nii.gz"

# Atlas regions, referred to by name below.
regions:
  lh: [ctx-lh-precentral, ctx-lh-paracentral]
  rh: [ctx-rh-precentral, ctx-rh-paracentral]
  both: [ctx-lh-precentral, ctx-rh-precentral, ctx-lh-paracentral, ctx-rh-paracentral]

# Contrasts competing in the winner-take-all, in label order (the first
# is label 1). Each uses the regions contralateral to the movement.
contrasts:
  LAvsOthers: {regions: rh, color: "#543005"}
  LFvsOthers: {regions: rh, color: "#8c510a"}
  LHvsOthers: {regions: rh, color: "#dfc27d"}
  LPvsOthers: {regions: both, color: "#b2182b"}
  RAvsOthers: {regions: lh, color: "#003c30"}
  RFvsOthers: {regions: lh, color: "#01665e"}
  RHvsOthers: {regions: lh, color: "#80cdc1"}

# Colour of voxels inside the ROI where no contrast survives
# thresholding (label "Rest"), and of the background (label 0).
rest_color: "#f5f5f5"
background_color: "#000000"

# fsaverage resolution used for resampling and fsaverage plots.
fsaverage: fsaverage

# Processing steps, run in the order listed. Each step has:
#   type:     what the step does (see create-bodymap.py, STEP_TYPES).
#   name:     optional, defaults to the type; must be unique, so a type
#             listed more than once needs a name.
#   enabled:  optional, default true. A disabled step is skipped; steps
#             reading its outputs use the files already on disk.
#   inputs:   required; each role of the step mapped to a path above.
#   outputs:  required; as for inputs.
#   params:   optional; passed to the function named in the comment.
steps:
  - type: correction  # volume.correct_images
    inputs: {p_values: p_value, mask: brain_mask}
    outputs: {corrected: p_value_corrected}
    params:
      alpha: 0.001
      method: fdr_bh

  - type: thresholding  # volume.threshold_images
    inputs: {z_score: z_score, p_values: p_value_corrected, mask: brain_mask}
    outputs: {thresholded: thresholded}
    params:
      alpha: 0.001

  - type: roi  # volume.roi_single_image, once per contrast
    inputs: {stats: thresholded, atlas: atlas}
    outputs: {rois: rois}

  - type: wta  # volume.wta, via volume.apply_across_volumes
    inputs: {rois: rois, mask: brain_mask}
    outputs: {wta: wta}
    params:
      only_positive: true

  - type: segmentation  # volume.save_as_segmentation
    inputs: {wta: wta, template: t1}
    outputs: {segmentation: segmentation}

  - type: mni_surfaces  # surface.transform_surface_to_mni, once per surface
    # {surf} in the paths is filled with each of `surfaces`.
    inputs: {native_surface: native_surface, xfm: xfm_mni_to_t1w}
    outputs: {mni_surface: mni_surface}
    params:
      surfaces: [pial, white]

  - type: projection  # surface.project_image
    # {surf} in the pial and white paths is filled with the role name.
    inputs: {volume: wta, pial: mni_surface, white: mni_surface, atlas: atlas}
    outputs: {projected: projected}
    params:
      interpolation: nearest_most_frequent
      kind: depth
      n_samples: 20
      standard_surface: MNI152NLin2009cAsym
      # Regions of each hemisphere; hemispheres are projected separately.
      hemi_regions: {left: lh, right: rh}
      # Fill gaps left by the projection, either with Workbench
      # dilation + erosion ...
      dilate_dist: 2.0
      erode: true
      # ... or with majority-vote smoothing (use one or the other):
      # smooth_iter: 3
      # smooth_fill_threshold: 0.5
      # smooth_n_ring: 1

  - type: fsaverage  # surface.transform_surface_to_fsaverage
    inputs: {projected: projected, sphere: sphere_reg, midthickness: midthickness}
    outputs: {fsaverage_labels: fsaverage_labels}

  - type: plot_mni  # plotting.make_plot on the MNI pial surface
    inputs: {projected: projected, pial: mni_surface}
    outputs: {plot: plot_mni}
    params:
      hemi: both
      view: dorsal
      avg_method: median
      symmetric_cbar: false

  - type: plot_fsaverage  # plotting.make_plot on the fsaverage pial surface
    inputs: {labels: fsaverage_labels}
    outputs: {plot: plot_fsaverage}
    params:
      hemi: both
      view: dorsal
      avg_method: median
      symmetric_cbar: false

  - type: views_mni  # plotting.plot_lateral_medial on the MNI pial surface
    inputs: {projected: projected, pial: mni_surface}
    outputs: {plot: views_mni}
    params:
      avg_method: median

  - type: views_fsaverage  # plotting.plot_lateral_medial on the fsaverage pial surface
    inputs: {labels: fsaverage_labels}
    outputs: {plot: views_fsaverage}
    params:
      avg_method: median

  - type: html  # plotting.make_html
    inputs: {fsaverage_labels: fsaverage_labels}
    outputs: {html: html}
    params:
      hemi: both
      symmetric_cbar: false

  - type: resampled_t1  # nilearn.image.resample_to_img
    inputs: {t1: t1, reference: wta}
    outputs: {resampled_t1: resampled_t1}
    params:
      interpolation: nearest
      force_resample: true
      copy_header: true

  - type: copy_inputs  # copies every input to the working directory
    inputs: {z_score: z_score, atlas: atlas, t1: t1}
    outputs: {}
